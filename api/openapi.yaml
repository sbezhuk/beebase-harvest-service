openapi: 3.0.3
info:
  title: BeeBase Harvest Service API
  description: >
    Harvest service for BeeBase, an open-source backend for a beekeeper
    management application split into microservices. Access tokens are
    issued by auth-service (see its OpenAPI spec); this service verifies
    them against auth-service's public key and never trusts a userID from
    anywhere but a verified token.

    A harvest record is one harvest event of one product (honey, pollen,
    propolis, or wax) collected from a hive. A hive may have any number
    of harvest records for the same product - each represents a separate
    harvest event, distinguished by harvested_at. Harvest is an
    independent domain (User -> Apiary -> Hive -> Harvest) - it does not
    reference an Inspection in any way, and has no ownership mechanism of
    its own:
    every operation confirms the caller owns the specified hive by
    forwarding the caller's own access token to hive-service's
    GET /api/v1/hives/{id} and trusting its answer, on every call, not
    just once at creation time. Since hive-service's own check is itself
    transitive against apiary-service, this single call confirms the
    whole chain - harvest-service never queries hive or apiary ownership
    itself, and never stores a copy of that ownership data.
  version: 0.1.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: harvest
    description: Create, read, update, and delete harvest records nested under one of the caller's own hives.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      security: []
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/hives/{hiveId}/harvest:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }

    post:
      tags: [harvest]
      summary: Record a harvested product for one of the caller's own hives
      description: >
        Rejected with 404 hive_not_found if hiveId doesn't exist or
        doesn't belong to the caller (which also covers its apiary not
        belonging to the caller) - verified live against hive-service,
        not trusted from the request or from any locally stored
        ownership data. A hive may have any number of harvest records for
        the same product - each POST creates a new, independent record
        for its own harvest event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHarvestRequest" }
      responses:
        "201":
          description: Harvest record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarvestResponse" }
        "400":
          description: >
            Request failed validation: missing/invalid product, missing/
            negative/invalid amount, missing/invalid unit, a product/unit
            combination that isn't allowed (e.g. HONEY + g), or a
            missing/invalid harvested_at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: hiveId doesn't exist, or belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [harvest]
      summary: List harvest records for one of the caller's own hives
      description: >
        Returns a page of harvest records for hiveId, ordered by
        harvested_at descending (id descending as a stable secondary sort
        for equal harvested_at values) - an empty page if the hive has
        none yet, or if no record matches the given filters. Omitting
        page/limit falls back to page=1, limit=20. product and
        amount_operator/amount are optional filters, combinable with
        each other and with pagination using AND semantics. Rejected with
        404 hive_not_found under the same conditions as POST.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: product
          in: query
          description: Optional exact-match filter on product.
          required: false
          schema: { $ref: "#/components/schemas/HarvestProduct" }
        - name: amount_operator
          in: query
          description: >
            Comparison applied by the amount filter. Must be given
            together with `amount` - either both are present or neither
            is.
          required: false
          schema: { $ref: "#/components/schemas/AmountOperator" }
        - name: amount
          in: query
          description: >
            The value amount_operator compares each record's amount
            against. Must be given together with `amount_operator`.
            Follows the same non-negative rule as the request body's own
            amount field.
          required: false
          schema: { type: number, minimum: 0 }
        - name: sortOrder
          in: query
          description: >
            Optional sort direction. Omitted keeps the endpoint's default
            order (harvested_at descending, id descending); when given
            ("asc" or "desc"), results are instead ordered by creation
            date (created_at) — not harvested_at — in that direction, with
            id tied to the same direction as a stable secondary sort.
          required: false
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: A page of the hive's harvest records.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HarvestResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: >
            hiveId is not a valid UUID, or page, limit, product,
            amount_operator, amount, or sortOrder is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: hiveId doesn't exist, or belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/hives/{hiveId}/harvest/{harvestId}:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: harvestId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [harvest]
      summary: Get one harvest record
      description: >
        Rejected with 404 hive_not_found if hiveId doesn't exist or
        doesn't belong to the caller, and with 404 harvest_not_found if
        harvestId doesn't exist or doesn't belong to hiveId.
      responses:
        "200":
          description: The harvest record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarvestResponse" }
        "400":
          description: hiveId or harvestId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: >
            No such hive (or it belongs to a different user), or no such
            harvest record under this hive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [harvest]
      summary: Replace a harvest record's product, amount, unit, and harvested_at
      description: >
        Full replacement (PUT semantics): product, amount, unit, and
        harvested_at are all set from the request body. Rejected with 404
        harvest_not_found if harvestId doesn't exist or doesn't belong to
        hiveId, and with 404 hive_not_found if hiveId itself doesn't
        exist or doesn't belong to the caller. Changing product to one
        already recorded on this hive is allowed - there is no
        uniqueness constraint between hive and product.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHarvestRequest" }
      responses:
        "200":
          description: The updated harvest record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarvestResponse" }
        "400":
          description: >
            hiveId or harvestId is not a valid UUID, or the request
            failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: >
            No such hive (or it belongs to a different user), or no such
            harvest record under this hive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [harvest]
      summary: Delete a harvest record
      description: >
        Deleting one harvest record never affects any other harvest
        record belonging to the same hive.
      responses:
        "204":
          description: The harvest record is deleted.
        "400":
          description: hiveId or harvestId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: >
            No such hive (or it belongs to a different user), or no such
            harvest record under this hive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    HarvestProduct:
      type: string
      description: >
        The kind of product a harvest record refers to. Closed set - there
        is no OTHER/custom product at this stage.
      enum: [HONEY, POLLEN, PROPOLIS, WAX]

    HarvestUnit:
      type: string
      description: >
        The unit an amount was recorded in. Only certain product/unit
        combinations are allowed (no automatic conversion is ever
        performed, e.g. Honey is never converted between kg and l):

        | Product  | Allowed units |
        |----------|---------------|
        | HONEY    | kg, l         |
        | POLLEN   | g, kg         |
        | PROPOLIS | g             |
        | WAX      | g             |
      enum: [g, kg, l]

    AmountOperator:
      type: string
      description: The comparison the harvest list endpoint's amount filter applies.
      enum: [gt, lt, eq]

    CreateHarvestRequest:
      type: object
      required: [product, amount, unit, harvested_at]
      properties:
        product: { $ref: "#/components/schemas/HarvestProduct" }
        amount:
          type: number
          minimum: 0
          description: The quantity collected, in `unit`. 0 is allowed; negative values are not.
        unit: { $ref: "#/components/schemas/HarvestUnit" }
        harvested_at:
          type: string
          format: date-time
          description: >
            When the product was actually collected (RFC 3339) - distinct
            from created_at/updated_at, which are technical timestamps
            for the record's own lifecycle.

    UpdateHarvestRequest:
      type: object
      required: [product, amount, unit, harvested_at]
      description: >
        Full replacement (PUT semantics) - there is no partial patch.
        product, amount, unit, and harvested_at are all set from the
        request body.
      properties:
        product: { $ref: "#/components/schemas/HarvestProduct" }
        amount:
          type: number
          minimum: 0
          description: The quantity collected, in `unit`. 0 is allowed; negative values are not.
        unit: { $ref: "#/components/schemas/HarvestUnit" }
        harvested_at: { type: string, format: date-time }

    HarvestResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        hive_id: { type: string, format: uuid }
        product: { $ref: "#/components/schemas/HarvestProduct" }
        amount: { type: number }
        unit: { $ref: "#/components/schemas/HarvestUnit" }
        harvested_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Metadata describing the requested page relative to the full result set.
      required: [page, limit, total, total_pages, has_next, has_previous]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Total matching rows across all pages., example: 37 }
        total_pages: { type: integer, example: 2 }
        has_next: { type: boolean }
        has_previous: { type: boolean }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - hive_not_found
                - invalid_hive_id
                - harvest_not_found
                - invalid_harvest_id
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
              example: harvest_not_found
            message: { type: string, example: harvest not found }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
              additionalProperties:
                type: string
                enum:
                  - product_required
                  - product_invalid
                  - amount_required
                  - amount_negative
                  - unit_required
                  - unit_invalid
                  - unit_invalid_for_product
                  - harvested_at_required
                  - harvested_at_invalid
                  - invalid_page
                  - invalid_limit
                  - invalid_product
                  - invalid_amount_operator
                  - invalid_amount
                  - invalid_sort_order
              example: { product: "product_invalid" }
